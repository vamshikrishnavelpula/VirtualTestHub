<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

    	body {
    	    background-color: rgba(89, 130, 251, 0.7);
    	    font-family: 'Poppins', sans-serif;
    	    margin: 0;
    	    padding: 0;
    	}

    	/* Heading */
    	h1 {
    	    text-align: center;
    	    text-decoration: underline;
    	    color: white;
    	    font-weight: 600;
    	    margin-top: 30px;
    	}
    
    	/* Form Container */
    	table {
    	    background-color: rgba(137, 191, 227, 0.97);
    	    font-size: 16px;
    	    color: #000;
    	    margin: 40px auto;
    	    border-radius: 20px;
    	    border: 4px solid white;
    	    padding: 25px 35px;
    	    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    	}
    
    	/* Table Text */
    	td {
    	    padding: 10px;
    	    text-align: left;
    	    vertical-align: middle;
    	}
    
    	/* Input Fields */
    	input[type="text"],
    	input[type="email"],
    	input[type="password"],
    	input[type="date"],
    	textarea {
    	    width: 100%;
    	    padding: 8px 10px;
    	    border: 1px solid #000;
    	    border-radius: 6px;
    	    outline: none;
    	    font-size: 15px;
    	    font-family: 'Poppins', sans-serif;
    	    transition: 0.3s ease;
    	}
    
    	input:focus,
    	textarea:focus {
    	    border-color: #3a6ef0;
    	    box-shadow: 0 0 4px rgba(58, 110, 240, 0.6);
    	}
    
    	/* Buttons */
    	input[type="submit"],
    	input[type="reset"] {
    	    background-color: #3a6ef0;
    	    border: none;
    	    color: white;
    	    padding: 8px 20px;
    	    border-radius: 5px;
    	    cursor: pointer;
    	    font-weight: 500;
    	    font-size: 15px;
    	    transition: background-color 0.3s ease;
    	    margin: 10px 5px;
    	}
    
    	input[type="submit"]:hover,
    	input[type="reset"]:hover {
    	    background-color: #2a4ecf;
    	}
    
    	/* Textarea */
    	textarea {
    	    resize: none;
    	    height: 80px;
    	}
    
    	/* Responsive Design */
    	@media only screen and (max-width: 768px) {
    	    table {
    	        width: 90%;
    	        margin: 20px auto;
    	        padding: 20px;
    	    }
    
    	    td {
    	        display: block;
    	        width: 100%;
    	        text-align: left;
    	    }
    
    	    input,
    	    textarea {
    	        width: 100%;
    	        margin-top: 5px;
    	    }
    
    	    input[type="submit"],
    	    input[type="reset"] {
    	        width: 48%;
    	        margin-top: 10px;
    	    }
    	}    
    </style>
</head>

<body>
    <form action="verify.php" method="post">
        <h1>Student Registration Form </h1>
        <table cellpadding="10">
        
            <tr>
                <td>First Name :</td>
                <td><input type="text" id="name" name="fname" placeholder="Enter Your First Name"></td>
            </tr>
            
            <tr>
                <td>Last Name :</td>
                <td><input type="text" id="name" name="lname" placeholder="Enter Your Last Name"></td>
            </tr>
            
            <tr>
                <td>email :</td>
                <td><input type="text" id="name" name="email" placeholder="Enter Your email"></td>
            </tr>
            
            <tr>
                <td>Password :</td>
                <td><input type="password" id="name" name="pass" placeholder="Enter Your Password"></td>
            </tr>
            
            <tr>
                <td>Re-Enter Password :</td>
                <td><input type="password" id="psd" name="repass" placeholder="Re-Enter Your Password"></td>
            </tr>
            
            <tr>
                <td>Date Of Birth :</td>
                <td><input type="date" id="name" name="DOB" placeholder="Enter Your Date Of Birth"></td>
            </tr>
            
            <tr>
                <td>Mobile Number :</td>
                <td><input type="number" id="name" name="MNUM" placeholder="Enter Your Mobile Number"></td>
            </tr>
            
            <tr>
                <td>Address :</td>
                <td><textarea rows="6" cols="25"  name="addr" placeholder="Enter Your Address"></textarea></td>
            </tr>
            
            <tr>
                <td>State :</td>
                <td><input type="text" id="name" name="state" placeholder="Enter Your state"></td>
            </tr>
            
            <tr>
                <td>City :</td>
                <td><input type="text" id="name" name="city" placeholder="Enter Your city"></td>
            </tr>
            
            <tr>
                <td>Country :</td>
                <td><input type="text" id="name" name="Country" placeholder="Enter Your Copuntry"></td>
            </tr>
            
            <tr>
                <td>pincode :</td>
                <td><input type="text" id="name" name="num" placeholder="Enter Your pincode"></td>
            </tr>
            
            <tr>
                <td align="center" colspan="2">
                    <button type="submit">Submit</button>
                    &nbsp;&nbsp; <button type="reset">Reset</button>
                </td>
            </tr>
            
        </table>
    </form>
</body>

</html>
